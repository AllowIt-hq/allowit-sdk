[workspace]
resolver = "3"
members = ["core"]

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true

# Rail crates pin allowit-sdk by git revision. This patch resolves those pins
# to the workspace core, so one allowit-sdk crate serves the whole graph.
[patch."https://github.com/allowit-hq/allowit-sdk.git"]
allowit-sdk = { path = "core" }
