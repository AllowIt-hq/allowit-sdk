[package]
name = "allowit-solana-vendor"
version.workspace = true
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "Allowit Solana host adapters and retained PaySH operation reconciliation"

[dependencies]
allowit-sdk = { workspace = true, features = ["client"] }
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "native-tls-vendored"] }
serde_json = "1.0.150"
