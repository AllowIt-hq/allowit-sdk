[package]
name = "allowit-tempo-services"
version.workspace = true
edition = "2024"
rust-version = "1.98"
license = "LicenseRef-Proprietary"
publish = false

[dependencies]
allowit-sdk = { workspace = true, features = ["service", "transport"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
num-bigint = "0.4.6"
