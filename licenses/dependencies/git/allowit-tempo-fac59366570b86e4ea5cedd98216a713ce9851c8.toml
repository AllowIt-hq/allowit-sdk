[package]
name = "allowit-tempo"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[features]
default = []
client = ["dep:allowit-client-core", "dep:libc", "dep:mpp", "dep:reqwest", "dep:zeroize", "dep:num-bigint", "dep:num-traits", "dep:time"]

[dependencies]
allowit-client-core = { git = "https://github.com/AllowIt-hq/allowit-sdk.git", rev = "d9a22d3c74667d41303f147ee4ba2e442cea3767", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
url = "2"
libc = { version = "0.2.190", optional = true }
mpp = { version = "=0.15.0", default-features = false, optional = true }
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "native-tls-vendored"], optional = true }
zeroize = { version = "1.8.2", optional = true }

num-bigint = { version = "0.4.6", optional = true }
num-traits = { version = "0.2.19", optional = true }
time = { version = "0.3", features = ["parsing"], optional = true }

[workspace]
