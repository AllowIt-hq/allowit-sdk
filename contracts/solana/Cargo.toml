[package]
name = "allowit-solana"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace]

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["custom-heap"]
custom-heap = []
no-entrypoint = []

[dependencies]
allowit-contract-core = { path = "../common" }
allowit-sdk = { path = "../..", default-features = false }
borsh = { version = "=1.6.0", features = ["derive"] }
solana-program = "=2.3.0"
spl-token = { version = "=8.0.0", features = ["no-entrypoint"] }

[dev-dependencies]
allowit-sdk = { path = "../..", features = ["compiler"] }
serde_json = "=1.0.150"
bincode = "=1.3.3"

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "allow" }
