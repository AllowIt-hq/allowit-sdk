name: Service facade
on:
  pull_request:
    paths: ["services/Cargo.toml", "services/Cargo.lock", "services/src/**", "services/README.md", ".github/workflows/services.yml"]
  push:
    paths: ["services/Cargo.toml", "services/Cargo.lock", "services/src/**", "services/README.md", ".github/workflows/services.yml"]
permissions:
  contents: read
jobs:
  services:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services
      - run: cargo fmt --manifest-path services/Cargo.toml --check
      - run: cargo clippy --manifest-path services/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path services/Cargo.toml --locked
