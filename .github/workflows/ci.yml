name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo check --locked --no-default-features --lib
      - run: cargo rustc --locked --release --lib --target wasm32-unknown-unknown --crate-type cdylib
      - run: node scripts/test-wasm.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: allowit-sdk-wasm
          path: target/wasm32-unknown-unknown/release/allowit_sdk.wasm
