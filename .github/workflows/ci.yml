name: CI
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Test core in its own invocation. A workspace build unifies the CLI's
      # serde_json arbitrary_precision and preserve_order features into core.
      - run: cargo test --locked -p allowit-sdk
      - name: Build and test the copy-paste policy template
        run: cargo test --locked -p allowit-policy-template
      - run: cargo clippy --locked -p allowit-sdk --all-targets -- -D warnings
      - name: Verify supported feature profiles
        run: |
          cargo check --locked -p allowit-sdk --no-default-features --lib
          cargo check --locked -p allowit-sdk --no-default-features --features compiler --lib
          cargo check --locked -p allowit-sdk --no-default-features --features typed-workflow --lib
          cargo check --locked -p allowit-sdk --no-default-features --features std --lib
          cargo check --locked -p allowit-sdk --no-default-features --features std,oracle-ledger --lib
          cargo check --locked -p allowit-sdk --no-default-features --features typed-workflow,oracle-ledger --lib
          cargo check --locked -p allowit-sdk --no-default-features --features oracle-ledger --lib
          cargo test --locked -p allowit-sdk --no-default-features --features compact-contract-validation --test contract_validation
          cargo test --locked -p allowit-sdk --features compact-contract-validation --test contract_validation
          cargo test --locked -p allowit-sdk --no-default-features --test feature_profiles
          cargo test --locked -p allowit-sdk --no-default-features --features typed-workflow --test typed_host_feature
          cargo test --locked -p allowit-sdk --no-default-features --features std,typed-workflow
      - name: Verify the client, service, transport and contract modules
        run: |
          cargo test --locked -p allowit-sdk --features client --lib -- client::
          cargo test --locked -p allowit-sdk --features service,transport --lib -- service::
          cargo test --locked -p allowit-sdk --features service,transport --test transport_rpc
          cargo test --locked -p allowit-sdk --features contract --lib -- contract::
          cargo test --locked -p allowit-sdk --features contract --test contract_binary --test contract_conformance
          cargo test --locked -p allowit-sdk --features contract-stellar --lib -- contract::
          cargo test --locked -p allowit-sdk --features contract-stellar --test contract_binary --test contract_conformance
          cargo check --locked -p allowit-sdk --no-default-features --features contract --lib
          cargo clippy --locked -p allowit-sdk --all-targets --features client,service,transport,contract -- -D warnings
          cargo clippy --locked -p allowit-sdk --all-targets --features contract-stellar -- -D warnings
      - run: cargo rustc --locked -p allowit-sdk --release --lib --target wasm32-unknown-unknown --crate-type cdylib
      - run: node core/tests/test-wasm.mjs
