name: CI
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --locked
      - name: Build and test the copy-paste policy template
        run: cargo test --locked --manifest-path templates/policy/Cargo.toml
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Verify supported feature profiles
        run: |
          cargo check --locked --no-default-features --lib
          cargo check --locked --no-default-features --features compiler --lib
          cargo check --locked --no-default-features --features typed-workflow --lib
          cargo check --locked --no-default-features --features std --lib
          cargo check --locked --no-default-features --features std,oracle-ledger --lib
          cargo check --locked --no-default-features --features typed-workflow,oracle-ledger --lib
          cargo check --locked --no-default-features --features oracle-ledger --lib
          cargo test --locked --no-default-features --features compact-contract-validation --test contract_validation
          cargo test --locked --features compact-contract-validation --test contract_validation
          cargo test --locked --no-default-features --test feature_profiles
          cargo test --locked --no-default-features --features typed-workflow --test typed_host_feature
          cargo test --locked --no-default-features --features std,typed-workflow
      - run: cargo rustc --locked --release --lib --target wasm32-unknown-unknown --crate-type cdylib
      - run: node scripts/test-wasm.mjs
      - run: |
          mkdir -p target/sdk-distribution
          cp target/wasm32-unknown-unknown/release/allowit_sdk.wasm target/sdk-distribution/
          python3 -m unittest discover -s scripts/tests -p test_package_licenses.py
          python3 scripts/package-licenses.py target/sdk-distribution
      - uses: actions/upload-artifact@v4
        with:
          name: allowit-sdk-wasm
          path: target/sdk-distribution/

  tempo-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tempo-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tempo-rust
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  native-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Verify the imported dependency lock matches the package
        working-directory: native
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('package.json'));
          const locked = JSON.parse(fs.readFileSync('package-lock.json')).packages[''];
          for (const key of ['dependencies', 'devDependencies', 'optionalDependencies']) {
            assert.deepEqual(locked[key] ?? {}, manifest[key] ?? {}, `package-lock.json ${key} are stale`);
          }
          // pnpm reads overrides from workspace config rather than npm's field.
          fs.writeFileSync('pnpm-workspace.yaml', `overrides: ${JSON.stringify(manifest.overrides ?? {})}\n`);
          JS
      - run: pnpm import
        working-directory: native
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: native
      - run: pnpm test
        working-directory: native
