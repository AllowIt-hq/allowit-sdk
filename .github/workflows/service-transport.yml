name: SDK service transport
on:
  pull_request:
    paths: ["services/transport/**", ".github/workflows/service-transport.yml"]
  push:
    paths: ["services/transport/**", ".github/workflows/service-transport.yml"]
permissions:
  contents: read
jobs:
  service-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/transport
      - run: cargo fmt --manifest-path services/transport/Cargo.toml --check
      - run: cargo clippy --manifest-path services/transport/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path services/transport/Cargo.toml --locked
