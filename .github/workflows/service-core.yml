name: SDK service core
on:
  pull_request:
    paths: ["services/core/**", ".github/workflows/service-core.yml"]
  push:
    paths: ["services/core/**", ".github/workflows/service-core.yml"]
permissions:
  contents: read
jobs:
  service-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - run: cargo fmt --manifest-path services/core/Cargo.toml --check
      - run: cargo clippy --manifest-path services/core/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path services/core/Cargo.toml --locked
