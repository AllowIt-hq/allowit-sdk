name: Contract runtimes
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
jobs:
  native-and-soroban:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32v1-none
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts/common -> target
            contracts/solana -> target
            contracts/stellar -> target
      - name: Check formatting and native conformance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p contracts/dist
          for rail in common solana stellar sbf-tests; do
            cargo fmt --manifest-path "contracts/$rail/Cargo.toml" --check
          done
          cargo test --locked --manifest-path contracts/common/Cargo.toml 2>&1 | tee contracts/dist/common-tests.log
          cargo test --locked --manifest-path contracts/solana/Cargo.toml 2>&1 | tee contracts/dist/solana-native-tests.log
          ALLOWIT_SOLANA_NETWORK=testnet cargo test --locked --manifest-path contracts/solana/Cargo.toml --test testnet -- --nocapture 2>&1 | tee contracts/dist/solana-testnet-asset-test.log
      - name: Build Soroban Wasm
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --target wasm32v1-none --manifest-path contracts/stellar/Cargo.toml 2>&1 | tee contracts/dist/stellar-build.log
          cp contracts/stellar/target/wasm32v1-none/release/allowit_stellar.wasm contracts/dist/
          sha256sum contracts/dist/allowit_stellar.wasm | tee contracts/dist/stellar-sha256.txt
      - name: Execute native Soroban and compiled Wasm tests
        shell: bash
        run: |
          set -euo pipefail
          export ALLOWIT_STELLAR_WASM="$GITHUB_WORKSPACE/contracts/dist/allowit_stellar.wasm"
          cargo test --locked --manifest-path contracts/stellar/Cargo.toml -- --nocapture 2>&1 | tee contracts/dist/stellar-runtime-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soroban-and-native-evidence
          path: contracts/dist/
          if-no-files-found: error
  solana-sbf:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ALLOWIT_SOLANA_NETWORK: devnet
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts/solana -> target
            contracts/sbf-tests -> target
      - name: Install checksum-pinned official Agave tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agave"
          curl --fail --location --retry 3 https://github.com/anza-xyz/agave/releases/download/v4.3.0/solana-release-x86_64-unknown-linux-gnu.tar.bz2 -o "$RUNNER_TEMP/agave.tar.bz2"
          printf '%s  %s\n' c97289a8abb1d0efb497d8b5cb285baabd9b7f8ea6647f5d145c5dc8ff3611e8 "$RUNNER_TEMP/agave.tar.bz2" | sha256sum --check
          tar -xjf "$RUNNER_TEMP/agave.tar.bz2" -C "$RUNNER_TEMP/agave"
          echo "$RUNNER_TEMP/agave/solana-release/bin" >> "$GITHUB_PATH"
      - name: Compile the actual SBF program
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p contracts/dist
          solana --version | tee contracts/dist/solana-toolchain.txt
          cargo build-sbf --version | tee -a contracts/dist/solana-toolchain.txt
          cargo build-sbf --manifest-path contracts/solana/Cargo.toml --tools-version v1.57 --sbf-out-dir "$GITHUB_WORKSPACE/contracts/dist" -- --locked 2>&1 | tee contracts/dist/solana-sbf-build.log
          if grep -Eqi 'Stack offset|stack frame.*(exceed|too large)' contracts/dist/solana-sbf-build.log; then
            echo 'SBF compiler reported an unsafe stack frame.' >&2
            exit 1
          fi
          sha256sum contracts/dist/allowit_solana.so | tee contracts/dist/solana-sha256.txt
      - name: Execute compiled SBF and real SPL Token in Mollusk
        shell: bash
        run: |
          set -euo pipefail
          export SBF_OUT_DIR="$GITHUB_WORKSPACE/contracts/dist"
          cargo test --locked --manifest-path contracts/sbf-tests/Cargo.toml -- --nocapture 2>&1 | tee contracts/dist/solana-sbf-runtime-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solana-sbf-evidence
          # build-sbf may generate a deployment keypair; it is never an artifact.
          path: |
            contracts/dist/*.so
            contracts/dist/*.log
            contracts/dist/*sha256.txt
            contracts/dist/solana-toolchain.txt
          if-no-files-found: error
