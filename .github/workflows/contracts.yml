name: Contract checks
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
jobs:
  common:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: "cargo test --locked -p allowit-sdk --features contract --lib -- contract::"
      - run: cargo test --locked -p allowit-sdk --features contract --test contract_binary --test contract_conformance
      - run: "cargo test --locked -p allowit-sdk --features contract-stellar --lib -- contract::"
      - run: cargo test --locked -p allowit-sdk --features contract-stellar --test contract_binary --test contract_conformance
      - run: cargo check --locked -p allowit-sdk --no-default-features --features contract --lib
