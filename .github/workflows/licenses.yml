name: Dependency license coverage
on:
  pull_request:
    paths: ["**/Cargo.lock", "**/Cargo.toml", "licenses/**", "LICENSE", "THIRD_PARTY_NOTICES.md", "scripts/package-licenses.py", "scripts/tests/test_package_licenses.py", ".github/workflows/licenses.yml"]
  push:
    paths: ["**/Cargo.lock", "**/Cargo.toml", "licenses/**", "LICENSE", "THIRD_PARTY_NOTICES.md", "scripts/package-licenses.py", "scripts/tests/test_package_licenses.py", ".github/workflows/licenses.yml"]
permissions:
  contents: read
jobs:
  licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s scripts/tests -p test_package_licenses.py
      - run: python3 scripts/package-licenses.py
