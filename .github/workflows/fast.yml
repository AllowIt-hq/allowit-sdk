name: Focused CI
on:
  pull_request:
  push:
    branches: [main, prod]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: focused-${{ github.repository }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  core-client:
    name: Shared client boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: "cargo test --locked -p allowit-sdk --features client --lib -- client::"
      - run: cargo clippy --locked -p allowit-sdk --features client --all-targets -- -D warnings
  core-service:
    name: Service and transport boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: "cargo test --locked -p allowit-sdk --features service,transport --lib -- service::"
      - run: cargo test --locked -p allowit-sdk --features service,transport --test transport_rpc
      - run: cargo clippy --locked -p allowit-sdk --features service,transport --all-targets -- -D warnings
  pins:
    name: Pins and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: scripts/build.sh
  scalar-policy:
    name: Scalar policy (${{ matrix.selector }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        selector:
          - purchase_tiers_require_the_ledger_feature_before_evaluation
          - native_storage_fields_require_the_trusted_host_profile
          - scalar_build_rejects_host_workflow_ir_before_any_evaluation
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Exercise one policy feature boundary
        env:
          TEST_SELECTOR: ${{ matrix.selector }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p allowit-sdk --no-default-features --test feature_profiles "$TEST_SELECTOR" -- --exact 2>&1 | tee "$RUNNER_TEMP/tests.log"
          grep -Eq '^test result: ok\. 1 passed; 0 failed;' "$RUNNER_TEMP/tests.log"
  service-policy:
    name: Service policy budget boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Check generic service admission and exact budget limits
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p allowit-sdk --test service_operations 2>&1 | tee "$RUNNER_TEMP/tests.log"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/tests.log"
  stellar-policy:
    name: Stellar compiled policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Check native policy semantics and source admission
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p allowit-sdk --test stellar_codegen 2>&1 | tee "$RUNNER_TEMP/tests.log"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/tests.log"
