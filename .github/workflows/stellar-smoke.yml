name: Stellar wallet SDK
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stellar-wallet-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stellar-wallet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stellar-rust -> target
      - run: cargo fmt --manifest-path stellar-rust/Cargo.toml --check
      - run: cargo test --locked --manifest-path stellar-rust/Cargo.toml
      - run: cargo clippy --locked --manifest-path stellar-rust/Cargo.toml --all-targets -- -D warnings
      - run: python3 scripts/package-licenses.py
